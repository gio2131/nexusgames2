<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta name="robots" content="noindex">
  <title>Not found — Nexus Games</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;display:grid;place-items:center;background:#070707;color:#f5f5f2;font-family:Arial,sans-serif}.box{max-width:620px;text-align:center}.mark{width:48px;height:48px;margin:0 auto 44px;border-radius:15px;display:grid;place-items:center;background:#d8ff3e;color:#090909;font-weight:800}small{color:#d8ff3e;letter-spacing:.16em;text-transform:uppercase;font-size:.66rem}h1{margin:15px 0 12px;font-size:clamp(4rem,14vw,8rem);line-height:.85;letter-spacing:-.08em}p{margin:0 auto 28px;color:#858585;line-height:1.6}a{display:inline-flex;min-height:46px;padding:0 19px;align-items:center;border-radius:999px;background:#d8ff3e;color:#090909;text-decoration:none;font-size:.82rem;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">N</div>
    <small>Error 404</small>
    <h1>Lost in<br>the void.</h1>
    <p>The page you were looking for is no longer in this universe.</p>
    <a id="home" href="/">Return home&nbsp; ↗</a>
  </main>
  <script>
    (function(){var base="/";if(/\.github\.io$/.test(location.hostname)){var segment=location.pathname.split("/")[1];if(segment)base="/"+segment+"/";}document.getElementById("home").href=base;}());
  </script>
</body>
</html>
