<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found - Arcade</title>
<meta name="robots" content="noindex">
<!-- Self-contained on purpose: a 404 can be served from any depth,
     so it cannot rely on relative asset paths. -->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; text-align: center;
    background: #fbfbfa; color: #18181b;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -.02em; margin: 0 0 8px; }
  p { color: #6b7280; margin: 0 0 22px; }
  a {
    display: inline-block; padding: 10px 18px; border-radius: 9px;
    background: #2563eb; color: #fff; text-decoration: none;
    font-size: .95rem; font-weight: 550;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1012; color: #e9e9ec; }
    p { color: #9096a0; }
    a { background: #6ea8fe; color: #0f1012; }
  }
</style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>That link does not go anywhere.</p>
    <a id="home" href="/">Back to Arcade</a>
  </div>
  <script>
    // Works on a custom domain and on user.github.io/repo/ alike.
    (function () {
      var base = "/";
      if (/\.github\.io$/.test(location.hostname)) {
        var seg = location.pathname.split("/")[1];
        if (seg) base = "/" + seg + "/";
      }
      document.getElementById("home").href = base;
    })();
  </script>
</body>
</html>
