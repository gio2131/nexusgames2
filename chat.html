<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Chat with other Nexus Games players.">
  <title>Chat — Nexus Games</title>
  <link rel="icon" href="assets/img/nexus-logo.png?v=brand-1" type="image/png">
  <script>if (new URLSearchParams(location.search).get("panel") === "1") document.documentElement.dataset.chatPanel = "true";</script>
  <script src="assets/js/theme.js?v=theme-3"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=chat-panel-3">
</head>
<body>
  <aside class="rail" aria-label="Primary navigation">
    <a class="rail-mark" href="index.html" aria-label="Nexus Games home"><img src="assets/img/nexus-logo.png?v=brand-1" alt=""></a>
    <nav class="rail-nav">
      <a href="index.html" data-page="index.html" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="games.html" data-page="games.html" aria-label="Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8a5 5 0 0 1 4.8 3.6l1.1 3.9a3 3 0 0 1-5.1 2.9L15.4 17H8.6l-1.4 1.4a3 3 0 0 1-5.1-2.9l1.1-3.9A5 5 0 0 1 8 8Z"/><path d="M7 12v3M5.5 13.5h3M16.5 12.5h.01M19 15h.01"/></svg><span>Games</span></a>
      <a href="chat.html" data-page="chat.html" aria-label="Chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H8l-4 3z"/><path d="M8 9h8M8 13h5"/></svg><span>Chat</span></a>
      <a href="settings.html" data-page="settings.html" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg><span>Settings</span></a>
    </nav>
  </aside>

  <div class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="index.html"><span><img src="assets/img/nexus-logo.png?v=brand-1" alt=""></span> NEXUS GAMES</a>
      <p><i></i> Community chat</p>
    </header>

    <main class="inner-main chat-main">
      <section class="chat-gate" id="chat-gate">
        <form class="chat-name-card" id="chat-name-form">
          <span class="chat-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H8l-4 3z"/><path d="M8 9h8M8 13h5"/></svg></span>
          <p class="eyebrow">Nexus chat</p>
          <h1>Enter a username</h1>
          <p>You choose a fresh username every time you enter the chat.</p>
          <label for="chat-username">Username</label>
          <input id="chat-username" maxlength="24" minlength="2" autocomplete="off" required placeholder="Enter a username">
          <button class="button" type="submit">Enter chat <span aria-hidden="true">→</span></button>
          <small id="chat-name-error" aria-live="polite"></small>
        </form>
      </section>

      <section class="chat-room" id="chat-room" hidden>
        <div class="chat-heading">
          <div><span class="eyebrow">Community</span><h1>Chatroom</h1><p id="chat-room-note">Messages clear every hour.</p></div>
          <span class="chat-status"><i></i><b id="chat-status">Connecting…</b></span>
        </div>
        <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>
        <form class="chat-compose" id="chat-form">
          <input id="chat-message" maxlength="300" autocomplete="off" required placeholder="Write a message…" aria-label="Message">
          <button class="button" id="chat-send" type="submit">Send</button>
        </form>
      </section>
    </main>
  </div>

  <script src="assets/js/site.js?v=chat-panel-2"></script>
  <script src="assets/js/chat.js?v=chat-1"></script>
</body>
</html>
