<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Nexus Games — a curated collection of games that launch instantly.">
  <title>Nexus Games</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <aside class="rail" aria-label="Primary navigation">
    <a class="rail-mark" href="index.html" aria-label="Nexus Games home">N</a>
    <nav class="rail-nav">
      <a href="index.html" data-page="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a href="games.html" data-page="games.html" aria-label="Games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8a5 5 0 0 1 4.8 3.6l1.1 3.9a3 3 0 0 1-5.1 2.9L15.4 17H8.6l-1.4 1.4a3 3 0 0 1-5.1-2.9l1.1-3.9A5 5 0 0 1 8 8Z"/><path d="M7 12v3M5.5 13.5h3M16.5 12.5h.01M19 15h.01"/></svg>
        <span>Games</span>
      </a>
    </nav>
    <span class="rail-status" title="Users online"><i></i> <b data-online-count>—</b></span>
  </aside>

  <div class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="index.html"><span>N</span> NEXUS GAMES</a>
      <p><i></i> Catalog ready</p>
    </header>

    <main class="home-main">
      <section class="continue-section" aria-labelledby="continue-title">
        <div class="simple-heading">
          <h1 id="continue-title">Continue playing</h1>
          <span id="spotlight-count">0 games</span>
        </div>
        <div class="feature" id="spotlight">
        <div class="feature-grid" aria-hidden="true"></div>
        <div class="orb orb-one" aria-hidden="true"></div>
        <div class="orb orb-two" aria-hidden="true"></div>
        <div class="feature-copy">
          <h1 id="feature-title">New worlds<br>loading.</h1>
          <p>The catalog is cleared and ready for its next lineup.</p>
          <a class="button" href="games.html">View catalog <span aria-hidden="true">↗</span></a>
        </div>
        </div>
        <div id="featured-row" class="featured-row" aria-live="polite"></div>
      </section>

      <section class="library-section" aria-labelledby="catalog-title">
        <div class="section-title">
          <h2 id="catalog-title">Catalog</h2>
          <span class="game-count"><b id="total">0</b> games</span>
        </div>
        <div id="featured" class="game-grid" aria-live="polite"></div>
      </section>
    </main>

  </div>

  <script src="assets/js/games-data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
